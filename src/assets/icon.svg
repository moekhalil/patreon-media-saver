<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Patreon Media Saver logo: a coral "record" disc with a play button, a download badge, on a dark tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a35"/>
      <stop offset="1" stop-color="#11131a"/>
    </linearGradient>
    <linearGradient id="disc" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#ff7a5c"/>
      <stop offset="0.55" stop-color="#ff424d"/>
      <stop offset="1" stop-color="#d81f4a"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ebf2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ff424d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff424d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)"/>

  <!-- disc -->
  <g filter="url(#shadow)">
    <circle cx="118" cy="116" r="78" fill="url(#disc)"/>
    <!-- subtle groove rings -->
    <circle cx="118" cy="116" r="62" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="118" cy="116" r="48" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <!-- play -->
    <path d="M101 82 L153 116 L101 150 Z" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- download badge -->
  <g filter="url(#shadow)">
    <circle cx="184" cy="184" r="44" fill="#11131a"/>
    <circle cx="184" cy="184" r="36" fill="url(#badge)"/>
    <path d="M184 163 V196 M170 183 L184 197 L198 183" fill="none" stroke="#ff424d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M168 207 H200" stroke="#ff424d" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
